<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    nomes dos filmes para cadastar: <input type="text" id="ipt_filmes"> <br>
    <button onclick="analisar()">cadastar</button> <br>
    <div id="exibir"></div>
    
</body>
<script>
    let lista_filmes=[];
    let mensagem ="";
    function analisar() {
        let mensagem="";
        lista_filmes.push(ipt_filmes.value)
        for(let i=0; i <lista_filmes.length;i++){
            if (i % 2 == 0) {
                mensagem += `<span style="color: blue;">${i+1}° filme é ${lista_filmes[i]} <br></span>`;
            }else{
                mensagem += `<span style="color: red;">${i+1}° filme é ${lista_filmes[i]} <br></span>`;  
            }
        }

        exibir.innerHTML = mensagem
    }
</script>
</html>
