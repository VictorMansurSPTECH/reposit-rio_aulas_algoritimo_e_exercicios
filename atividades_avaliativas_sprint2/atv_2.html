<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    O tamanho da pista (em metros): <input type="number" id="ipt_tamanho_pista"><br>
    Quantos metros a tartaruga anda por rodada: <input type="number" id="ipt_qtd_metros_tartaruga"><br>
    Quantos metros o coelho anda por rodada: <input type="number" id="ipt_qtd_metrso_coelho"><br>
    A cada quantas rodadas o coelho dorme: <input type="number" id="ipt_qtd_soneca_coelho"> <br>

    <div id="exibir"></div> <br>
    <button onclick="analisar()">Dar a Largada</button>
</body>

<script>
    let tamanho_pista=0;
    let qtd_metros_tartaruga=0;
    let qtd_metros_coelho=0;
    let qtd_soneca_coelho=0;
    let mensagem=""
    function analisar() {

        let tamanho_pista =Number(ipt_tamanho_pista.value);
        let vel_metros_tartaruga=Number(ipt_qtd_metros_tartaruga.value);
        let vel_metros_coelho= Number(ipt_qtd_metrso_coelho.value);
        let intervalo_soneca_coelho=Number(ipt_qtd_soneca_coelho.value);


        let contador_distancia_tartaruga=0;
        let contador_distancia_coelho=0;
        let contador_soeneca_coelho=0;
        let contador_rodadas=0;

        let verificacao1= (tamanho_pista<=0 || vel_metros_tartaruga<=0 || vel_metros_coelho<=0 || intervalo_soneca_coelho<=0);
        let verificacao2= vel_metros_tartaruga >= vel_metros_coelho;
        let verificacao3= intervalo_soneca_coelho <2;
        if(verificacao1){
            mensagem="Digite valores válidos para todos os campos!";
        }else if(verificacao2){
            mensagem="A tartaruga não pode ser mais rápida que o coelho!";
        }else if(verificacao3){
            mensagem="O coelho não pode dormir a cada rodada!";
        }else{
            while((contador_distancia_coelho<tamanho_pista) && (contador_distancia_tartaruga<tamanho_pista)){
                contador_rodadas++;
                contador_distancia_tartaruga+=vel_metros_tartaruga;
                mensagem+=`Rodada ${contador_rodadas}: A tartaruga ${contador_distancia_tartaruga} metros |`
                if(contador_rodadas%intervalo_soneca_coelho!=0){
                    contador_distancia_coelho+=vel_metros_coelho;
                    mensagem+=` coelh0 ${contador_distancia_coelho} metros <br>`;
                }else{
                    mensagem+=` ${contador_distancia_coelho} metros - coelho dormindo ZZZ<br>`;
                    contador_soeneca_coelho++;
                }

            }
            if(contador_distancia_tartaruga>=tamanho_pista){
                mensagem+= `<br> Resultado: 
                Tartarugo Devagarinho venceu na rodada ${contador_rodadas}! <br>
                Coelhildo Soneca completou ${((contador_distancia_coelho/tamanho_pista)*100).toFixed(2)}% da pista.
                O coelho tirou ${contador_soeneca_coelho} sonecas, o que representa ${((contador_soeneca_coelho/contador_rodadas)*100).toFixed(2)}% das rodadas.`
            }else if (contador_distancia_coelho >= tamanho_pista && contador_distancia_tartaruga >= tamanho_pista){
                mensagem+= `<br> Resultado: 
                Empate na rodada ${contador_rodadas}! <br>
                Tartarugo Devagarinho completou ${((contador_distancia_tartaruga/tamanho_pista)*100).toFixed(2)}% da pista. <br>
                Coelhildo Soneca completou ${((contador_distancia_coelho/tamanho_pista)*100).toFixed(2)}% da pista. <br>
                O coelho tirou ${contador_soeneca_coelho} sonecas, o que representa ${((contador_soeneca_coelho/contador_rodadas)*100).toFixed(2)}% das rodadas.`
            }else{
                mensagem+= `<br> Resultado: 
                Coelhildo Soneca venceu na rodada ${contador_rodadas}! <br>
                Tartarugo Devagarinho completou ${((contador_distancia_tartaruga/tamanho_pista)*100).toFixed(2)}% da pista.`
            }
            contador_rodadas=0;
        }
        exibir.innerHTML=mensagem;
        mensagem="";
    }
</script>
</html>
