<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    quantidade de rodadas: <input type="number" id="ipt_rodadas"> <br>
    O tamanho da pista (em metros): <input type="number" id="ipt_tamanho_pista"><br>
    Quantos metros a tartaruga anda por rodada: <input type="number" id="ipt_qtd_metros_tartaruga"><br>
    Quantos metros o coelho anda por rodada: <input type="number" id="ipt_qtd_metrso_coelho"><br>
    A cada quantas rodadas o coelho dorme: <input type="number" id="ipt_qtd_soneca_coelho"> <br>

    <div id="exibir"></div> <br>
    <button onclick="analisar()">Dar a Largada</button>
</body>

<script>
    let rodadas=0;
    let tamanho_pista=0;
    let qtd_metros_tartaruga=0;
    let qtd_metros_coelho=0;
    let qtd_soneca_coelho=0;
    let mensagem=""
    function analisar() {
        rodadas=Number(ipt_rodadas.value);
        tamanho_pista =Number(ipt_tamanho_pista.value);
        vel_metros_tartaruga=Number(ipt_qtd_metros_tartaruga.value);
        vel_metros_coelho= Number(ipt_qtd_metrso_coelho.value);
        intervalo_soneca_coelho=Number(ipt_qtd_soneca_coelho.value);
        let contador_rodada=1;
        let contador_tartaruga=0;
        let contador_coelho=0;

        if (rodadas <0 || tamanho_pista <0 || vel_metros_coelho < 0 || vel_metros_tartaruga <0) {
            alert("valores inválidos");
            if (vel_metros_tartaruga >= vel_metros_coelho) {
                alert("a tartaruga deve ser a mais lenta")
            } else if(intervalo_soneca_coelho < 2){
                alert("o coelho vai dormir todas as rodadas");
            }
        } else {
            while (contador_rodada < rodadas) {
                contador_tartaruga += vel_metros_tartaruga
                contador_coelho += vel_metros_coelho

                mensagem += `Rodada ${contador_rodada}: tartaruga ${contador_tartaruga}M |  `
                mensagem += `<br>`

                    if (rodadas % intervalo_soneca_coelho==0) {
                        contador_coelho = contador_coelho;

                        mensagem += `  coelho ${contador_coelho} o coelho dormiu nesta rodada`

                    }else{
                        mensagem += `  coelho ${contador_coelho}`
                    }
    
                contador_rodada ++

                
            }
            
        }
        exibir.innerHTML= mensagem
    }
</script>
</html>
