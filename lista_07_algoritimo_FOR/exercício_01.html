<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 1</title>
</head>
<body>
    <button onclick="Contar()">Contar</button> <br>
    <div id="exibir"></div>
</body>

<script>
    function Contar() {
        for(let contador=15; contador>0;contador--){
            exibir.innerHTML +=`${contador} <br>`;
        }
    }
</script>
</html>
