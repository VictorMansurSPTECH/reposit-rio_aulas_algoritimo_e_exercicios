<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 03</title>
</head>
<body>
    insira valor da renda individual do usuário: <input type="number" id="ipt_renda_individual"> <br>
    insira valor da renda familiar do usuário: <input type="number" id="ipt_renda_familiar"> <br>
    <button onclick="analisar()">Terei o benefício</button><br>
    <div id="exibir"></div>
</body>
<script>
    let renda_indiv=0;
    let renda_familiar=0;
    function analisar() {
        renda_indiv = Number(ipt_renda_individual.value);
        renda_familiar= Number(ipt_renda_familiar.value);
        if (renda_indiv <= 2000 || renda_familiar <=3000) {
            alert( "Você terá direito ao auxílio");
        } else {
            alert( "Sem direito ao auxílio");
        }
    }
</script>
</html>
