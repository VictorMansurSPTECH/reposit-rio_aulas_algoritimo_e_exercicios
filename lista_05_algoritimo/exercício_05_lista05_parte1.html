<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 5</title>
</head>
<body>
    nota do aluno: <input type="number" id="ipt_nota"> <br>
    <button onclick="verificar()">verificar</button> <br>
    <div id="exibir"></div>
</body>
<script>
    let nota =0;
    function verificar() {
        nota= Number(ipt_nota.value);
        if (nota <6) {
            exibir.innerHTML=`Aluno não aprovado`;
        } else if (nota >=8.5 && nota <=10) {
            exibir.innerHTML=`Aluno Exemplar!`;
        }
        else if (nota > 6 && nota <8.5){
            exibir.innerHTML=`Aluno comum e aprovado`;
        }
    }
</script>
</html>
