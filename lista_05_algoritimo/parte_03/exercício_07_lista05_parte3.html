<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 7</title>
</head>
<body>
    <h1>autenticação segura</h1> <br>

    insira o login: <input type="text" id="ipt_login"> <br> <br>
    insira a senha: <input type="password" id="ipt_senha"> <br> <br>
    insira a informação secreta: <input type="text" id="ipt_info"> <br> <br>
    <button onclick="autenticar()">Autenticar</button>
    <div id="resultado"></div>

</body>
<script>
    let login = "";
    let senha = "";
    let info = "";
    let tentativas = 3;
    let bloqueado = false;

    function autenticar() {
        if (bloqueado) {
            return;
        }

        login = ipt_login.value;
        senha = ipt_senha.value;
        info = ipt_info.value;

        if (login === "ana" && senha === "braga" && info === "1949") {
            resultado.innerHTML = "Autenticação bem-sucedida!";
            tentativas = 3;
        } else {
            tentativas = tentativas - 1;

            if (tentativas <= 0) {
                bloqueado = true;
                resultado.innerHTML = "Falha de autenticação <br> Usuário BLOQUEADO! Procure seu gerente!";
            } else {
                resultado.innerHTML = "Falha de autenticação <br> Você ainda tem " + tentativas + " tentativa(s)";
            }
        }
    }
</script>
</html>
