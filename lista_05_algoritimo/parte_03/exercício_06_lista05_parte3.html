<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 6</title>
</head>
<body>
    insira a nota do aluno: <input type="number" id="ipt_nota">
    insira a frequência do aluno: <input type="number" id="ipt_frequencia">
    <button onclick="verificarAprovacao()">Verificar Aprovação</button>
    <div id="resultado"></div>
</body>
<script>
    let nota=0;
    let frequencia=0;
    function verificarAprovacao() {
        if(nota <0 || nota >10){
            resultado.innerHTML = "Onde já se viu nota <0 ou >10?!";
            if(frequencia <0 || frequencia >100){
                resultado.innerHTML = "Onde já se viu frequência <0 ou >100?!";
            }
        }
        else if (frequencia >= 75){
            if(nota >= 0 && nota <6) {
                resultado.innerHTML = "Aluno ficou abaixo da média!";
            }
            else if (nota >=6 && nota <8) {
                resultado.innerHTML = "Aluno ficou na média!";
            }
            else if (nota >=8 && nota <=10){
                resultado.innerHTML = "Aluno ficou acima da média!";
            }
        }
    }
</script>
</html>
