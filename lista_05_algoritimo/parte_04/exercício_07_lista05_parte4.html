<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercício 7</title>
</head>
<body>
    idade do solicitante: <input type="number" id="ipt_idade"> <br> <br>
    possui CNH válida?: <select id="ipt_cnh">
        <option>sim</option>
        <option>não</option>
    </select> <br> <br>
    renda mensal: <input type="number" id="ipt_renda"> <br> <br>
    apresentou fiador?: <select id="ipt_fiador">
        <option>sim</option>
        <option>não</option>
    </select> <br> <br>
    <button onclick="analisar()">Analisar financiamento</button> <br>
    <div id="exibir"></div>
</body>
<script>
    let idade = 0;
    let cnh = "";
    let renda = 0;
    let fiador = "";

    function analisar() {
        idade = Number(ipt_idade.value);
        cnh = ipt_cnh.value;
        renda = Number(ipt_renda.value);
        fiador = ipt_fiador.value;

        if (idade >= 21 && cnh == "sim" && (renda >= 2500 || fiador == "sim")) {
            alert("Financiamento aprovado");
        } else {
            alert("Financiamento negado");
        }
    }
</script>
</html>
