     </select> <br> <br>
     <button onclick="analisar()">Verificar bolsa</button> <br>
     <div id="exibir"></div>
</body>
<script>
    let percapita=0;
    let media=0;
    let federado="";

        percapita=Number(ipt_percapita.value);
        media=Number(ipt_media.value);
        federado=ipt_federal.value;
        if ((percapita <=800 && media>=8) || (federado =="sim" && media >=6)) {
            alert("Bolsa integral concedida!")
        } else {

        }
    }
