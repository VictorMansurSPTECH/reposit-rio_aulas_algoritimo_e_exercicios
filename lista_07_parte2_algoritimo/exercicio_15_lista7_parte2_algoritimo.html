<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Solicite um intervalo crescente de valores numéricos:
    inicio da sequência: <input type="number" id="ipt_inicio"> <br>
    fim sequência : <input type="number" id="ipt_fim"> <br>
    <button onclick="analisar()">Curto 3 e 5!</button> <br>
    <div id="exibir"></div>
</body>
<script>
    let inicio=0;
    let fim = 0;
    let mensagem="";
    // criando variáveis globais 
    function analisar() {
        inicio= Number(ipt_inicio.value);
        fim = Number(ipt_fim.value);
        let i=0;
        i= inicio
            while (i <= fim) {
                i++
                calc_mult_3 = i%3==0;
                calc_mult_5 = i%5==0;
                if (calc_mult_3 == true) {
                    mensagem += `É TRI! <br>`
                    
                }else if (calc_mult_5 == true){
                    mensagem += `É PENTA! <br>`
                }else{
                    mensagem += `É TRI!É PENTA! <br>`
                }
            }
        exibir.innerHTML=mensagem
    }
</script>
</html>
