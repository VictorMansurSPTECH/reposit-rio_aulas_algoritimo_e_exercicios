<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="pares()">S2 Pares</button> <br>
    <div id="exibir"></div>
</body>
<script>
    function pares() {
        let mensagem = "";
        let i = 1;
        while (i <= 100) {
            if (i %2==0) {
                mensagem += `<br>${i}`;
            }
            i++;
        }
        exibir.innerHTML = mensagem;
    }
</script>
</html>
