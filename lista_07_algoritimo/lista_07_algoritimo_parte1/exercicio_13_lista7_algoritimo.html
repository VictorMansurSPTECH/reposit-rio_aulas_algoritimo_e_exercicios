<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papagaio Repetitivo</title>
</head>
<body>
    Pergunte ao usuário um número: <input type="number" id="ipt_numero"> <br>
    Pergunte ao usuário uma frase: <input type="text" id="ipt_frase"> <br>  
    <button onclick="analisar()">Papagaio Repetitivo</button> <br>
    <div id="exibir"></div>

    <script>
        function analisar() {
            let frase = ipt_frase.value;
            let numero = Number(ipt_numero.value);
            let mensagem = "";

            let contador_de_controle = 1; // Contador da linha atual
            while (contador_de_controle <= numero) {
                mensagem += `${contador_de_controle} - `;

                let contador_2 = 0; // Contador de repetição da frase na linha
                while (contador_2 < contador_de_controle) {
                    mensagem += `${frase} `;

                    contador_2++;
                }

                mensagem += "<br>"; // Quebra de linha ao final de cada linha

                contador_de_controle++;
            }

            exibir.innerHTML = mensagem;
        }
    </script>
</body>
</html>
