<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     limite inferior da amostragem: <input type="number" id="ipt_limite_inferior_amostragem"> <br> <br>
     limite superior da amostragem: <input type="number" id="ipt_limite_superior_amostragem"> <br> <br>
     número para testar a divisibilidade: <input type="number" id="ipt_numero_divisor"> <br> <br>
     <button onclick="analisar()">Contar</button> <br>
     <div id="exibir"></div>
</body>

<script>
    let limite_inferior_amostragem=0;
    let limite_superior_amostragem=0;
    let numero_divisor=0;
    let lista=[];
    let contador=0;
    let mensagem="";

    function analisar() {
        limite_inferior_amostragem=Number(ipt_limite_inferior_amostragem.value);
        limite_superior_amostragem=Number(ipt_limite_superior_amostragem.value);
        numero_divisor=Number(ipt_numero_divisor.value);
        contador=limite_inferior_amostragem;
        let qtd_multiplos=0;
        let soma_multiplos=0;


        if(limite_inferior_amostragem<1){
            alert("O limite inferior da amostragem deve ser maior que 1")
        }else if(limite_superior_amostragem>100 || limite_superior_amostragem<=limite_inferior_amostragem){
            alert("O limite superior da amostragem deve ser maior que 100 e maior que o limite inferior da amostragem")

        }else if(numero_divisor<3 || numero_divisor>10){
            alert("O número para testar a divisibilidade deve ser maior que 3 e menor que 10")
        }else{
            while (contador < limite_superior_amostragem) {
                contador++
                if (contador%numero_divisor==0) {
                    qtd_multiplos++
                    soma_multiplos+=contador
                    lista.push(contador)
                    console.log(lista)
                }
            }
            mensagem += `    QUANTIDADE TOTAL DE NÚMEROS EXIBIDOS: ${qtd_multiplos} <br>
                             SOMATÓRIO DOS NÚMEROS EXIBIDOS: ${soma_multiplos} <br>
                             MÉDIA DOS NÚMEROS EXIBIDOS: ${soma_multiplos/qtd_multiplos} <br> 
                             MAIOR NÚMERO EXIBIDO: ${lista[lista.length - 1]} <br>
                             MENOR NÚMERO EXIBIDO: ${lista[0]} <br>
                             <br> <br> <br>`
            
        

        exibir.innerHTML = mensagem;

        }
        mensagem=""
    }
</script>
</html>
