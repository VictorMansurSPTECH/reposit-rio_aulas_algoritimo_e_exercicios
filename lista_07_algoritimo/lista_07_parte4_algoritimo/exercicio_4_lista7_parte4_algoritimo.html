<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    digite um número para descobrir se é primo: <input type="number" id="ipt_numero"> <br>
    <button onclick="exibir_divisores()">Ver Divisores</button> <br>
    <div id="exibir"></div>
</body>
<script>
    function exibir_divisores() {
        let numero = Number(ipt_numero.value);
        let mensagem = "";
        let contador = 0;


            mensagem += `Divisores do Número ${numero}:<br>`;
            while (contador <= numero) {
                if (numero % contador === 0 && numero % 1 === 0) {
                    mensagem += `${contador} <br>`;

                }else{
                    console.log("não é divisor")
                }
                contador++;
            }
        
        exibir.innerHTML = mensagem;
    }
</script>
</html>
