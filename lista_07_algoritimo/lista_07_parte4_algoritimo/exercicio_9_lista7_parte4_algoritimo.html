<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poupança</title>
</head>

<body>
    <h2>Poupança</h2>

    Entre com o valor mensal de depósito: <input id="ipt_deposito" type="number"> <br>
    Entre com a quantidade de meses: <input id="ipt_meses" type="number"> <br>
    Entre com o percentual de juros: <input id="ipt_juros" type="number"> <br> <br>

    Qual é o seu sonho: <input id="ipt_sonho"> <br>
    Qual o valor do seu sonho: <input id="ipt_valorSonho" type="number">

    <button onclick="projetar()">Projetar</button><br> <br>

    <div id="div_msg"></div>
</body>

<script>
    function projetar() {
        let deposito = Number(ipt_deposito.value);
        let meses = Number(ipt_meses.value);
        let juros = Number(ipt_juros.value);
        let sonho = ipt_sonho.value;
        let valorSonho = Number(ipt_valorSonho.value);

        let mensagem = "";

        if (deposito <= 0) {
            alert("O valor do depósito deve ser maior que 0");
        } else if (!Number.isInteger(meses) || meses <= 0) {
            alert("A quantidade de meses deve ser um número inteiro maior que 0");
        } else if (juros <= 0 || juros >= 10) {
            alert("O percentual de juros deve ser maior que 0 e menor que 10");
        } else if (sonho.length < 3) {
            alert("O sonho deve conter no mínimo 3 caracteres");
        } else if (valorSonho <= deposito) {
            alert("O valor do sonho deve ser maior que o valor do depósito");
        } else {
            let contador = 1;
            let valorInicial = 0;
            while (contador <= meses) {
                let valorJuros = valorInicial * (juros / 100);
                let valorFinal = valorInicial + valorJuros + deposito;
                mensagem += `Mês = ${contador} - Valor Inicial = R$ ${valorInicial.toFixed(2)} - Juros = R$ ${valorJuros.toFixed(2)} - Depósito = R$ ${deposito.toFixed(2)} - Valor Final = R$ ${valorFinal.toFixed(2)}<br>`
                valorInicial = valorFinal; 
                contador++;
            }
            if (valorInicial >= valorSonho) {
                let sobra = valorInicial - valorSonho;
                mensagem += `<br>Parabéns você é um POUPADOR, além do seu sonho de ${sonho} ainda sobrou R$ ${sobra.toFixed(2)} para outras aquisições`;
            } else {
                let falta = valorSonho - valorInicial;
                mensagem += `<br>Você precisa poupar um pouco mais. Para o sonho de ${sonho} ainda falta R$ ${falta.toFixed(2)}`;
            }
        }

        div_msg.innerHTML = mensagem;
    }
</script>

</html>
