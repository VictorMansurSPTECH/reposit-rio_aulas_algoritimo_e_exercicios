<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     Pergunte ao usuário quantas voltas um carro dará numa corrida: <input type="number" id="ipt_voltas"> <br>
     <button onclick="iniciar()">iniciar corrida</button> <br>
     <div id="exibir"></div>
</body>
<script>
    let voltas =0;
    let mensagem ="";
    function iniciar() {
        voltas=Number(ipt_voltas.value);
        let i=1;
        while (i <= voltas) {
            mensagem += `<br>O carro está na ${i} volta`
            i++
        }
        exibir.innerHTML=`${mensagem}`
    }
    
</script>
</html>
