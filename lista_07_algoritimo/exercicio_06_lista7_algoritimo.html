<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="filtrar()">Filtrar números Cabalísticos</button> <br>
    <div id="exibir"></div>
</body>
<script>
    function filtrar() {
        let mensagem = "";
        let i = 1;
        while (i <= 30) {
            if (i != 3 && i != 4 && i != 7 && i != 10 && i != 12) {
                mensagem += `<br>${i}`;
            }
            i++;
        }
        exibir.innerHTML = mensagem;
    }
</script>
</html>
