<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Solicite um intervalo crescente de valores numéricos:
    inicio da sequência: <input type="number" id="ipt_inicio"> <br>
    fim sequência : <input type="number" id="ipt_fim"> <br>
    Solicite um número para teste de divisibilidade, ele tem que estar entre 3 e 13: <input type="number" id="ipt_numero_teste"> <br>
    <button onclick="analisar()">Divisível"</button> <br>
    <div id="exibir"></div>
</body>
<script>
    let inicio=0;
    let fim = 0;
    let numero =0;
    let mensagem="";
    // criando variáveis globais 
    function analisar() {
        inicio= Number(ipt_inicio.value);
        fim = Number(ipt_fim.value);
        numero= Number(ipt_numero_teste.value);
        let i=0;
        let calc =0;
        // criando uma função e variáveis de auxílio 

        if (numero <3 || numero >13) {
            alert("valor inválido"); // verificação do número divisor 
        } else {
            i= inicio
            while (i <= fim) {
                i++
                calc = i%numero==0;
                if (calc == false) {
                    mensagem += `${i} não é divisivel pelo número ${numero}<br>`
                    
                }
            }
        }
        exibir.innerHTML=mensagem
    }
</script>
</html>
