<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     Receba do usuário um número (tem que ser entre 20 e 100): <input type="number" id="ipt_numero"> <br> 
    <button onclick="multiplos()">Adoro múltiplos de 5</button> <br>
    <div id="exibir"></div>
</body>
<script>
    function multiplos() {
        let mensagem = "";
        let numero = Number(ipt_numero.value);
        let i = 20;
        
        if (numero <20 || numero>100) {
            alert("Valor incorreto")
        } else {
            while (i <=numero ) {
            if (i %5==0) {
                mensagem += `<br>${i}`;
            }
            i++;
        }
        }
        exibir.innerHTML = mensagem;
    }
</script>
</html>
