<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 01</title>
</head>
<body>

    <h1>permissão de ir para as festas</h1>

    Digite a sua idade: <input type="number" id="ipt_digite_idade">
    <button onclick="validar()">Validar permissão</button>

    
</body>

<script>
    let idade_usuário =0;

    function validar() {
        idade_usuário = Number(ipt_digite_idade.value)

        if (idade_usuário < 18) {
            alert('Pedir permissão pro responsável');
        }
        else{
            alert('partiuFesta')
        }
    }
</script>
</html>
