<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 08</title>
</head>
<body>
    <h1>cheque parcial</h1> <br> <br>

     saldo da conta: <input type="number" id="ipt_saldo"> <br>
     valor do débito (ou seja, valor a tirar da conta): <input type="number" id="ipt_debito">

     <div  style="color: red;" id="exibir"></div> <br> <br>

     <button onclick="Analisar()">Analisar conta</button>


</body>

<script>
    let saldo = 0;
    let debito = 0;
    let calc =0;

    function Analisar() {
        saldo = Number(ipt_saldo.value);
        debito = Number(ipt_debito.value);
        calc = saldo - debito

        exibir.innerHTML=`O saldo atual da conta corrente é ${calc.toFixed(2)}`;
    }
</script>
</html>
