<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 10</title>
</head>
<body>
    <h1>Controle de horas assistindo streaming</h1> <br> <br>

     informar a última série (SITCOM) que vc assistiu: <input type="text" id="ipt_serie"> <br> <br>
     total de episódios que ele já assistidos da série: <input type="number" id="ipt_totalEP"> <br> <br>

     <div id="exibir"></div> <br>
     <button onclick="verificar()"> verificar nível</button>
</body>

<script>
    let serie = '';
    let eps = 0;
    function verificar() {
        serie = ipt_serie.value
        eps = Number(ipt_totalEP.value) 
        let calc = (eps * 22)/60

        if (calc > 30) {
            exibir.innerHTML=`"Uau, você realmente gosta dessa série!"`;
        } else {
            exibir.innerHTML=`Vejo que você gosta da série ${serie}`;
        }

    }
</script>
</html>
