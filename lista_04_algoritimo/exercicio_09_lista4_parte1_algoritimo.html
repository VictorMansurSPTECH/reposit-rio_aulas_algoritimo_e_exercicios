<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 09</title>
</head>
<body>
    <h1>Controle de peso no elevador</h1> <br> <br>

    quantidade de homens que entraram no elevador: <input type="number" id="ipt_peso_homem"> <br> <br>
    quantidade de mulheres que entraram no elevador: <input type="number" id="ipt_peso_mulher"> <br> <br>

    <div id="exibir"></div>
    <button onclick="verificar()">Verificar</button>
</body>

<script>
    let peso_homem=0;
    let peso_mulher =0;

    function verificar() {
        peso_homem = Number(ipt_peso_homem.value);
        peso_mulher = Number(ipt_peso_mulher.value);
        let calc = (peso_homem * 80) + (peso_mulher * 60)

        if (calc > 800) {
            exibir.innerHTML= '<span style="color: blue;">Será necessário que alguém desça para que o elevador se movimente</span>';
        } else {
            exibir.innerHTML= `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${calc}kg`;
        }
    }
</script>
</html>
